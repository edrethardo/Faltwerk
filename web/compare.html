<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:,">
<title data-de="CurveStream-GS – Vergleich (P9)">CurveStream-GS – comparison (P9)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #dde; overflow: hidden; font: 13px/1.3 system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  #grid { flex: 1; min-height: 0; display: grid; gap: 2px; background: #222; touch-action: none; }
  .pane { position: relative; background: #000; min-width: 0; min-height: 0; overflow: hidden; }
  .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pane .label { position: absolute; left: 0; right: 0; top: 0; padding: 4px 6px; background: linear-gradient(#000c, #0000);
    text-shadow: 0 0 3px #000; cursor: pointer; z-index: 2; }
  .pane .label .rate { color: #9fd; margin-left: 4px; }
  .pane .label .qual { color: #fd9; margin-left: 6px; }
  .pane .label .st { color: #aab; font-size: 11px; display: block; }
  .pane .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #333; z-index: 2; transition: opacity .5s; }
  .pane .progress div { height: 100%; width: 0; background: #4c9; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: #111; border-top: 1px solid #333; }
  #bar button, #bar select { font: inherit; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; min-height: 34px; }
  #bar button { min-width: 42px; }
  #slider { flex: 1 1 160px; min-width: 120px; height: 30px; }
  #frame { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  #panesel label, #bar > label { white-space: nowrap; }
  #status, #note { color: #889; font-size: 11px; }
  #note { flex-basis: 100%; }
  @media (max-width: 760px) { #bar { gap: 4px; } #note { display: none; } }
</style>
</head>
<body>
<div id="grid"></div>
<div id="bar">
  <button id="play" title="Play/pause (space)" data-de-title="Play/Pause (Leertaste)">▶</button>
  <button id="prev" title="Previous frame (←)" data-de-title="Frame zurück (←)">◀︎|</button>
  <button id="next" title="Next frame (→)" data-de-title="Frame vor (→)">|▶︎</button>
  <input id="slider" type="range" min="0" max="0" step="1" value="0">
  <span id="frame">–</span>
  <select id="speed" title="Speed" data-de-title="Geschwindigkeit"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  <select id="cam" title="Camera" data-de-title="Kamera"></select>
  <select id="diff" title="Difference to the original (snap mode with original/GT only): |ours − original| per pixel, ×1 raw, ×4 amplified" data-de-title="Differenzbild zum Original (nur im Snap-Modus mit Original/GT): |ours − Original| je Pixel, ×1 roh, ×4 verstärkt" disabled>
    <option value="0" selected>Render</option><option value="1">|ours − Original| ×1</option><option value="4">|ours − Original| ×4</option></select>
  <button id="reset" title="Reset view (double tap)" data-de-title="Ansicht zurücksetzen (Doppeltipp)">⟲</button>
  <select id="scene" title="Scene" data-de-title="Szene"></select>
  <span id="panesel"></span>
  <label title="ours: evaluate the curves between frames (only visible at slow playback)" data-de-title="ours: Kurven zwischen den Frames auswerten (nur bei langsamer Wiedergabe sichtbar)"><input id="interp" type="checkbox"> <span data-de="Zwischenbilder">In-between frames</span></label>
  <span id="status" data-de="lade …">loading …</span>
  <span id="note"></span>
</div>
<script type="module" src="./compare.js"></script>
</body>
</html>
